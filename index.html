<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4 en Raya Brutal</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="app">
        <header class="topbar">
            <div>
                <h1>🔥 4 en Raya Brutal</h1>
                <p class="subtitle">Caos, poderes y eventos inesperados</p>
            </div>

            <div class="controls">
                <label>
                    Modo
                    <select id="modeSelect">
                        <option value="pvp">2 Jugadores</option>
                        <option value="ai">Vs IA</option>
                    </select>
                </label>

                <label>
                    Filas
                    <select id="rowsSelect">
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8" selected>8</option>
                        <option value="9">9</option>
                    </select>
                </label>

                <label>
                    Columnas
                    <select id="colsSelect">
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9" selected>9</option>
                        <option value="10">10</option>
                    </select>
                </label>

                <label>
                    Mapa
                    <select id="mapSelect">
                        <option value="classic">Clásico</option>
                        <option value="obstacles">Obstáculos</option>
                        <option value="chaos">Caos</option>
                        <option value="gravityLeft">Gravedad</option>
                        <option value="frozen">Congelado</option>
                        <option value="random">Aleatorio</option>
                    </select>
                </label>

                <button id="newGameBtn">Nueva partida</button>
            </div>
        </header>

        <section class="hud">
            <div class="card status-card">
                <div id="turnText" class="turn-text">Turno: Rojo</div>
                <div id="connectInfo" class="connect-info">Conecta <span id="connectCount">4</span> en raya para ganar</div>
                <div id="eventInfo" class="event-info">Próximo caos: desconocido...</div>
            </div>

            <div class="card powers-card">
                <div class="powers-title">Poderes <span id="playerPoints" class="points-badge">0 pts</span></div>
                <div class="powers-grid">
                    <button class="power-btn" data-power="bomb" data-points="0">
                        💣 Bomba
                        <span>Destruye una ficha</span>
                        <span class="points-req">0 pts</span>
                    </button>
                    <button class="power-btn" data-power="columnShift" data-points="2">
                        🌊 Ola
                        <span>Mueve una columna</span>
                        <span class="points-req">2 pts</span>
                    </button>
                    <button class="power-btn" data-power="freeze" data-points="4">
                        ❄️ Hielo
                        <span>Bloquea una columna</span>
                        <span class="points-req">4 pts</span>
                    </button>
                    <button class="power-btn" data-power="doubleDrop" data-points="6">
                        ⚡ Doble ficha
                        <span>Caen 2 fichas</span>
                        <span class="points-req">6 pts</span>
                    </button>
                </div>
                <div class="powers-note">Gana partidas para desbloquear poderes. Usa 1 vez por partida.</div>
            </div>
        </section>

        <section class="board-wrap">
            <div id="announcement" class="announcement hidden"></div>
            <div id="board" class="board"></div>
        </section>

        <section class="legend">
            <div class="player-chip red-chip">Rojo</div>
            <div class="player-chip yellow-chip">Amarillo</div>
            <div class="legend-item">🪨 bloqueada</div>
            <div class="legend-item">❄️ congelada</div>
        </section>
    </main>

    <script src="game.js"></script>
</body>

</html>
