</head>
<body>
    <div class="scene" id="scene" aria-hidden="true">
        <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
        <div class="spot"></div>
        <canvas></canvas>
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="flash"></div>
    </div>
    <main class="entry">
        <section class="hero" aria-labelledby="title">
            <div class="mini-board" aria-hidden="true">
                <div class="mini-pieces">
                    <i class="disc red" style="--c:0;--r:3;--i:0"></i>
                    <i class="disc yellow" style="--c:1;--r:3;--i:1"></i>
                    <i class="disc red" style="--c:1;--r:2;--i:2"></i>
                    <i class="disc yellow" style="--c:2;--r:3;--i:3"></i>
                    <i class="disc yellow" style="--c:2;--r:2;--i:4"></i>
                    <i class="disc red" style="--c:2;--r:1;--i:5"></i>
                    <i class="disc yellow" style="--c:3;--r:3;--i:6"></i>
                    <i class="disc yellow" style="--c:3;--r:2;--i:7"></i>
                    <i class="disc yellow" style="--c:3;--r:1;--i:8"></i>
                    <i class="disc red last" style="--c:3;--r:0;--i:9"></i>
                </div>
                <div class="mini-plate"></div>
            </div>
            <h1 id="title">4 en<br>raya</h1>
            <p class="tagline">El clásico de siempre, ahora con poderes, hielo y terremotos.</p>
        </section>

        <section class="panel glass" aria-label="Acceso">
            <button type="button" class="btn btn-google btn-block" id="google-btn">
                <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                <span>Continuar con Google</span>
            </button>
            <div class="or"><span>o con tu usuario</span></div>

            <div class="tabs" role="tablist" aria-label="Entrar o crear cuenta">
                <button class="tab active" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form" data-tab="login">Entrar</button>
                <button class="tab" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form" data-tab="register" tabindex="-1">Crear cuenta</button>
            </div>

            <form id="login-form" class="form active" aria-labelledby="tab-login" novalidate>
                <div class="field">
                    <label for="login-email">Usuario o email</label>
                    <input type="text" id="login-email" name="user" autocomplete="username" required maxlength="80" aria-describedby="login-email-err">
                    <p class="field-error" id="login-email-err"></p>
                </div>
                <div class="field">
                    <label for="login-password">Contraseña</label>
                    <span class="pw">
                        <input type="password" id="login-password" name="password" autocomplete="current-password" required maxlength="72" aria-describedby="login-password-err">
                        <button type="button" class="pw-toggle" data-target="login-password" aria-label="Mostrar contraseña">Mostrar</button>
                    </span>
                    <p class="field-error" id="login-password-err"></p>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <form id="register-form" class="form" aria-labelledby="tab-register" novalidate>
                <div class="field">
                    <label for="reg-username">Nombre de usuario <small>3 a 15 letras, números o _</small></label>
                    <input type="text" id="reg-username" name="username" autocomplete="username" required minlength="3" maxlength="15" pattern="[A-Za-z0-9_ÁÉÍÓÚáéíóúÑñÜü]{3,15}" aria-describedby="reg-username-err">
                    <p class="field-error" id="reg-username-err"></p>
                </div>
                <div class="field">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" autocomplete="email" required maxlength="120" aria-describedby="reg-email-err">
                    <p class="field-error" id="reg-email-err"></p>
                </div>
                <div class="field">
                    <label for="reg-password">Contraseña <small>mínimo 8 caracteres</small></label>
                    <span class="pw">
                        <input type="password" id="reg-password" name="new-password" autocomplete="new-password" required minlength="8" maxlength="72" aria-describedby="reg-password-err">
                        <button type="button" class="pw-toggle" data-target="reg-password" aria-label="Mostrar contraseña">Mostrar</button>
                    </span>
                    <p class="field-error" id="reg-password-err"></p>
                </div>
                <!-- trampa para robots: las personas no ven ni rellenan este campo -->
                <div class="hp" aria-hidden="true">
                    <label for="reg-website">Deja este campo vacío</label>
                    <input type="text" id="reg-website" name="website" tabindex="-1" autocomplete="off">
                </div>
                <label class="check">
                    <input type="checkbox" id="reg-terms" required aria-describedby="reg-terms-err">
                    <span>Acepto los <a href="terminos.html">términos</a> y la <a href="privacidad.html">política de privacidad</a></span>
                </label>
                <p class="field-error" id="reg-terms-err"></p>
                <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
            </form>

            <p id="login-error" class="error-msg" role="alert"></p>
            <p id="login-success" class="success-msg" role="status"></p>

            <div class="or"><span>o</span></div>
            <a class="btn btn-ghost btn-block" id="guest-btn" href="game.html">Jugar sin cuenta</a>
            <p class="guest-note">Sin cuenta puedes jugar contra la IA y con alguien en el mismo dispositivo. Con cuenta guardas tus victorias, tienes amigos y juegas online.</p>
        </section>
    </main>

    <footer class="site-footer">
        <a href="privacidad.html">Privacidad</a>

</body>
</html>
