<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#173a40">
    <title>4 en Raya Brutal</title>
    <link rel="preload" href="../fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="entry">
        <section class="hero" aria-labelledby="title">
            <div class="mini-board" aria-hidden="true">
                <div class="mini-pieces">
                    <i class="disc red" style="--c:0;--r:3;--i:0"></i>
                    <i class="disc yellow" style="--c:1;--r:3;--i:1"></i>
                    <i class="disc red" style="--c:1;--r:2;--i:2"></i>
                    <i class="disc yellow" style="--c:2;--r:3;--i:3"></i>
                    <i class="disc yellow" style="--c:2;--r:2;--i:4"></i>
                    <i class="disc red" style="--c:2;--r:1;--i:5"></i>
                    <i class="disc yellow" style="--c:3;--r:3;--i:6"></i>
                    <i class="disc yellow" style="--c:3;--r:2;--i:7"></i>
                    <i class="disc yellow" style="--c:3;--r:1;--i:8"></i>
                    <i class="disc red last" style="--c:3;--r:0;--i:9"></i>
                </div>
                <div class="mini-plate"></div>
            </div>
            <h1 id="title">4 en raya<br>brutal</h1>
            <p class="tagline">El clásico de siempre, con bombas, hielo y terremotos.</p>
        </section>

        <section class="panel" aria-label="Acceso">
            <div class="tabs" role="tablist">
                <button class="tab active" role="tab" aria-selected="true" data-tab="login">Entrar</button>
                <button class="tab" role="tab" aria-selected="false" data-tab="register">Crear cuenta</button>
            </div>

            <form id="login-form" class="form active">
                <label>Usuario o email
                    <input type="text" id="login-email" autocomplete="username" required>
                </label>
                <label>Contraseña
                    <span class="pw">
                        <input type="password" id="login-password" autocomplete="current-password" required>
                        <button type="button" class="pw-toggle" data-target="login-password">Mostrar</button>
                    </span>
                </label>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <form id="register-form" class="form">
                <label>Nombre de usuario
                    <input type="text" id="reg-username" autocomplete="username" required maxlength="15">
                </label>
                <label>Email
                    <input type="email" id="reg-email" autocomplete="email" required>
                </label>
                <label>Contraseña <small>mínimo 4 caracteres</small>
                    <span class="pw">
                        <input type="password" id="reg-password" autocomplete="new-password" required minlength="4">
                        <button type="button" class="pw-toggle" data-target="reg-password">Mostrar</button>
                    </span>
                </label>
                <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
            </form>

            <p id="login-error" class="error-msg" role="alert"></p>
            <p id="login-success" class="success-msg" role="status"></p>

            <div class="or"><span>o</span></div>
            <button type="button" class="btn btn-ghost btn-block" id="guest-btn">Jugar como invitado</button>
            <p class="guest-note">Como invitado juegas en local y contra la IA. Para el ranking y las salas online necesitas cuenta.</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/utils/api.js"></script>
    <script src="../js/components/login.js"></script>
</body>
</html>
